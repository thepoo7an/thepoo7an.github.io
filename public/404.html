<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۴۰۴ - صفحه یافت نشد | THEPOO7AN</title>
  <meta name="robots" content="noindex, follow">
  <meta id="metaTheme" name="theme-color" content="#050506">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./fonts/fonts.css">

  <script>
    (function() {
      var root = document.documentElement;
      var t = null;
      var lang = null;
      try {
        t = localStorage.getItem('tp7-theme') || localStorage.getItem('app_theme');
        lang = localStorage.getItem('app_lang');
      } catch (e) {}
      if (!t) {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      root.setAttribute('data-theme', t);
      if (lang === 'en') {
        root.setAttribute('lang', 'en');
        root.setAttribute('dir', 'ltr');
      }
      var metaTheme = document.getElementById('metaTheme');
      if (metaTheme) {
        metaTheme.setAttribute('content', t === 'light' ? '#fafafa' : '#050506');
      }
    })();
  </script>

  <style>
    :root {
      --fa: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
      --en: 'Unbounded', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #050506;
      --card: #0c0c0f;
      --txt: #f4f4f5;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.11);
      --btn: #2563eb;
      --btn-txt: #ffffff;
      --link: #3b82f6;
      --chrome-text: linear-gradient(110deg, #f4f4f5 0%, #93c5fd 50%, #f4f4f5 100%);
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg: #fafafa;
      --card: #ffffff;
      --txt: #09090b;
      --muted: #52525b;
      --line: rgba(9, 9, 11, 0.11);
      --btn: #2563eb;
      --btn-txt: #ffffff;
      --link: #2563eb;
      --chrome-text: linear-gradient(110deg, #09090b 0%, #2563eb 50%, #09090b 100%);
      color-scheme: light;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: var(--fa);
      line-height: 1.8;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    html[dir="ltr"] body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      position: relative;
    }

    .brand {
      position: absolute;
      top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--en);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--txt);
      text-decoration: none;
      min-height: 44px;
      padding: 0 8px;
    }

    .error-code {
      font-family: var(--en);
      font-size: clamp(92px, 18vw, 168px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--chrome-text);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      user-select: none;
    }

    .title {
      font-size: clamp(20px, 3.8vw, 28px);
      font-weight: 800;
      color: var(--txt);
      margin-bottom: 8px;
      text-wrap: balance;
    }

    .subtitle {
      font-size: clamp(14px, 2.2vw, 16px);
      color: var(--muted);
      margin-bottom: 32px;
      max-width: 440px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 28px;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-txt);
      font-size: 14.5px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .home-btn:hover {
      opacity: 0.92;
    }

    .home-btn:active {
      transform: scale(0.98);
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--txt);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .secondary-btn:hover {
      border-color: var(--txt);
    }

    .secondary-btn:active {
      transform: scale(0.98);
    }

    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    html[dir="ltr"] .home-btn svg {
      transform: scaleX(-1);
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>

  <!-- GitHub Pages SPA redirect script -->
  <script>
    (function() {
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      if (pathParts.length > pathSegmentsToKeep) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <a class="brand" href="./" dir="ltr"><span>THEPOO7AN</span></a>

    <div class="error-code" id="errorCode" aria-hidden="true">404</div>
    <h1 class="title" id="errorTitle">صفحه مورد نظر پیدا نشد</h1>
    <p class="subtitle" id="errorSub">آدرس واردشده وجود ندارد یا تغییر کرده است.</p>

    <div class="actions">
      <a href="./" class="home-btn" id="homeBtn">
        <span id="homeLabel">بازگشت به صفحه اصلی</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M11 6l-6 6 6 6"/>
        </svg>

      <a href="./order.html" class="secondary-btn" id="orderBtn">دریافت برآورد پروژه</a>
    </div>
  </div>

  <footer id="footerText">
    © 2026 THEPOO7AN (پویان کریمی) · تمام حقوق محفوظ است.
  </footer>

  <script>
    (function() {
      if (document.documentElement.getAttribute('lang') === 'en') {
        document.title = '404 - Page Not Found | THEPOO7AN';
        document.getElementById('errorTitle').textContent = 'Page Not Found';
        document.getElementById('errorSub').textContent = 'The requested URL does not exist or has been moved.';
        document.getElementById('homeLabel').textContent = 'Back to Portfolio';

</body>
</html>
