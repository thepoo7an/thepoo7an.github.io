<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۴۰۴ - صفحه یافت نشد | THEPOO7AN</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Cpath d='M32 12l4.6 15.4L52 32l-15.4 4.6L32 52l-4.6-15.4L12 32l15.4-4.6z' fill='%23f5f5f7'/%3E%3C/svg%3E">
  
  <link rel="stylesheet" href="./fonts/fonts.css">

  <style>
    :root {
      --bg: #000000;
      --bg-soft: #0b0b0c;
      --card: #1d1d1f;
      --txt: #f5f5f7;
      --muted: #86868b;
      --line: rgba(255, 255, 255, 0.14);
      --btn: #0071e3;
      --btn-txt: #ffffff;
      --link: #2997ff;
      --focus-ring: #2997ff;
      --chrome-text: linear-gradient(100deg, #86868b 0%, #f5f5f7 30%, #6e6e73 50%, #ffffff 70%, #86868b 100%);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      --fa: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
      --en: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: var(--fa);
      line-height: 1.8;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      position: relative;
    }

    .brand {
      position: absolute;
      top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--en);
      font-weight: 600;
      font-size: 15px;
      color: var(--txt);
      text-decoration: none;
    }

    .brand i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--chrome-text);
      display: inline-block;
    }

    .error-code {
      font-size: clamp(96px, 18vw, 170px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--chrome-text);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      user-select: none;
    }

    .title {
      font-size: clamp(20px, 3.8vw, 28px);
      font-weight: 700;
      color: var(--txt);
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: var(--en);
      font-size: clamp(14px, 2.2vw, 16px);
      color: var(--muted);
      margin-bottom: 32px;
      letter-spacing: 0.02em;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 32px;
      border-radius: 999px;
      background: var(--btn);
      color: var(--btn-txt);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(0, 113, 227, 0.35);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .home-btn:hover {
      filter: brightness(1.12);
      transform: scale(1.02);
    }

    .home-btn:active {
      transform: scale(0.98);
    }

    .home-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>

  <!-- GitHub Pages SPA redirect script -->
  <script>
    (function() {
      // User site lives at root domain (https://thepoo7an.github.io/)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // Only perform SPA redirect if there is an actual routing path requested
      var pathParts = l.pathname.split('/').filter(Boolean);
      if (pathParts.length > pathSegmentsToKeep) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <a class="brand" href="./"><i aria-hidden="true"></i><span>thepoo7an</span></a>
    
    <div class="error-code" aria-hidden="true">۴۰۴</div>
    <h1 class="title">صفحه مورد نظر پیدا نشد</h1>
    <p class="subtitle">Page not found</p>
    
    <a href="./" class="home-btn">
      بازگشت به صفحه اصلی
      <svg viewBox="0 0 24 24">
        <path d="M19 12H5M11 6l-6 6 6 6"/>
      </svg>
    </a>
  </div>

  <footer>
    © ۱۴۰۵ — تمام حقوق برای پیج thepoo7an محفوظ است.
  </footer>
</body>
</html>
